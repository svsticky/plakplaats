{% for s in stickers %}
<div class="overlay-sticker-card">
  <img src="{{ s.picture_url }}" class="overlay-sticker-img">

  <div class="overlay-meta">
    <span>#{{ s.id }}</span>
    <span class="posttime" data-posttime="{{ s.posttime }}">
      Posted just now
    </span>
    <span class="distance" data-distance="{{ s.distance_m }}">...</span>
  </div>

  <button onclick="flyToSticker({{ s.lat }}, {{ s.lon }}, {{ s.id }})">
    Open on map
  </button>
</div>
{% endfor %}
