{# templates/admin_base.html #}
<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin — Plakplaats</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
    <style>
        /* your existing styles (radio + partial show/hide) */
        .tab-radio {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            clip: rect(0 0 0 0);
            overflow: hidden;
            border: 0;
        }

        .tab-label {
            padding: 8px 12px;
            background: #2b2b2b;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        #tab-review:checked~header .tabs label[for="tab-review"],
        #tab-dashboard:checked~header .tabs label[for="tab-dashboard"] {
            background: #fff;
            color: #000;
        }

        .partial-section {
            display: none;
        }

        #tab-review:checked~.partials #partial-review {
            display: block;
        }

        #tab-dashboard:checked~.partials #partial-dashboard {
            display: block;
        }

        /* (keep rest of your CSS or external admin.css) */
    </style>
</head>

<body>
    <div class="admin-shell">
        <input type="radio" name="admin_tab" id="tab-review" class="tab-radio" autocomplete="off" {% if active=='review'
            or active is not defined %}checked{% endif %}>
        <input type="radio" name="admin_tab" id="tab-dashboard" class="tab-radio" autocomplete="off" {% if
            active=='dashboard' %}checked{% endif %}>

        <header>
            <div class="nav" role="navigation" aria-label="Admin navigation">
                <div class="title">Sticker Map Admin</div>
                <div class="tabs" role="tablist" aria-label="Admin tabs">
                    <label for="tab-review" class="tab-label" role="tab" tabindex="0">Review</label>
                    <label for="tab-dashboard" class="tab-label" role="tab" tabindex="0">Dashboard</label>
                </div>
            </div>
        </header>

        <div class="partials">
            <section id="partial-review" class="partial-section"
                aria-hidden="{{ 'false' if active == 'review' else 'true' }}">
                {% include 'admin_review.html' %}
            </section>

            <section id="partial-dashboard" class="partial-section"
                aria-hidden="{{ 'false' if active == 'dashboard' else 'true' }}">
                {% include 'admin_dashboard.html' %}
            </section>
        </div>
    </div>
</body>

</html>
