{# templates/admin_dashboard.html #}
<div>
  <h1>All Stickers</h1>
  <p style="color: #aaa">Recent stickers (server-rendered).</p>

  <div class="grid"
       style="display: grid;
              grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
              gap: 12px;
              margin-top: 12px">
    {% for sticker in stickers %}
      <div class="gridItem"
           id="grid-{{ sticker.id }}"
           style="background: #222;
                  padding: 8px;
                  border-radius: 8px;
                  color: white">
        <img src="{{ url_for('static', filename=sticker.picture) }}"
             style="width: 100%;
                    height: 120px;
                    object-fit: cover;
                    border-radius: 6px"
             alt="sticker-{{ sticker.id }}" />
        <div style="font-size: 13px; margin-top: 6px">
          <div>
            <strong>ID:</strong> {{ sticker.id }}
          </div>
          <div>
            <strong>Posted:</strong> {{ sticker.posttime.strftime('%Y-%m-%d
             %H:%M:%S') }}
          </div>
          <div style="margin-top: 6px">
            <a href="https://www.google.com/maps/place/{{ sticker.latitude }},{{ sticker.longitude }}"
               target="_blank">Open location</a>
          </div>
        </div>
      </div>
    {% else %}
      <div style="color: white">No stickers found.</div>
    {% endfor %}
  </div>
</div>
