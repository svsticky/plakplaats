<div 
  id="nearYouOverlay"
  x-data="overlayState()"
  x-init="init()"
  :class="{ 'active': open, 'inactive': !open, 'mobile': isMobile, 'desktop': !isMobile }"
  class="overlay"
  @touchstart="onTouchStart($event)"
  @touchmove="onTouchMove($event)"
  @touchend="onTouchEnd()"
>

  <!-- Drag handle -->
  <img src="/static/img/line.svg" id="nearYouMobileLine" class="drag-line">

  <!-- Title -->
  <h1>Stickers near you</h1>

  <!-- Error -->
  <h2 class="error" x-text="error" x-show="error"></h2>

  <!-- Sticker list -->
  <div 
    id="stickerList"
    hx-get="/api/nearby-stickers"
    hx-trigger="revealed"
    hx-target="#stickerList"
    hx-swap="innerHTML">
  </div>

</div>

<!-- Desktop toggle button -->
<button 
  id="nearYouDesktopToggleButton"
  x-data
  @click="document.getElementById('nearYouOverlay').__x.$data.toggleDesktop()">
  Show Stickers
</button>
